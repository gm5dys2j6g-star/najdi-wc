<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Najdi WC 🚻</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a}
header{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:1000;border-bottom:1px solid #ddd}
h1{margin:0 0 10px;font-size:25px}.search{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:14px;font-size:16px}
.hint{font-size:12px;color:#69737d;margin-top:6px}.chips{display:flex;gap:8px;overflow:auto;padding-top:10px}
.chip{border:0;background:#eef1f4;padding:9px 13px;border-radius:20px;white-space:nowrap}.chip.active{background:#17202a;color:#fff}
#map{height:56vh;min-height:390px}.locate{position:absolute;right:14px;top:135px;z-index:900;border:0;border-radius:50%;width:48px;height:48px;background:#fff;box-shadow:0 3px 12px #0003;font-size:22px}
.panel{background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:800;padding:16px;box-shadow:0 -3px 15px #0002}
.nearest{width:100%;border:0;border-radius:16px;background:#0a84ff;color:#fff;font-size:18px;font-weight:700;padding:15px;margin-bottom:10px}
.status{text-align:center;font-size:13px;color:#66717c;margin:4px 0 10px}.wc{border:1px solid #e1e5e9;border-radius:16px;padding:14px;margin:9px 0;background:#fff}
.wc b{font-size:17px}.meta{font-size:13px;color:#66717c;margin-top:5px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{background:#eef7ee;border-radius:8px;padding:5px 7px;font-size:12px}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px;z-index:1000}
.nav button{border:0;background:none;font-size:12px;color:#4d5964}.nav span{display:block;font-size:21px;margin-bottom:2px}.empty{padding:25px;text-align:center;color:#68737d}
</style>
</head>
<body>
<header><h1>🚻 Najdi WC</h1>
<input id="search" class="search" placeholder="Hledat město, adresu nebo WC…">
<div class="hint">🌍 Živá data veřejných WC z OpenStreetMap</div>
<div class="chips">
<button class="chip active" data-filter="all">Vše</button><button class="chip" data-filter="free">Zdarma</button>
<button class="chip" data-filter="open">Otevřeno</button><button class="chip" data-filter="accessible">Bezbariérové</button>
</div></header>
<div id="map"></div><button class="locate" id="locate">📍</button>
<section class="panel"><button class="nearest" id="nearest">🚻 NAJÍT NEJBLIŽŠÍ WC</button>
<div id="status" class="status">Načítám veřejná WC…</div><div id="list"></div></section>
<nav class="nav"><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>🗺️</span>Mapa</button>
<button onclick="document.getElementById('list').scrollIntoView({behavior:'smooth'})"><span>📋</span>Seznam</button>
<button onclick="alert('Přidání WC bude v další verzi.')"><span>➕</span>Přidat WC</button>
<button onclick="alert('Oblíbené WC budou v další verzi.')"><span>⭐</span>Oblíbené</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OVERPASS=[
'https://overpass-api.de/api/interpreter',
'https://overpass.kumi.systems/api/interpreter',
'https://overpass.private.coffee/api/interpreter',
'https://overpass.nchc.org.tw/api/interpreter'
];
let map=L.map('map').setView([50.089,17.703],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let markers=[],userMarker=null,filter='all',toilets=[],loading=false,lastBox='',timer=null;
function dist(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function position(e){return e.type==='node'?{lat:e.lat,lon:e.lon}:{lat:e.center&&e.center.lat,lon:e.center&&e.center.lon}}
function normalize(e){const p=position(e);if(!p||!Number.isFinite(p.lat)||!Number.isFinite(p.lon))return null;const t=e.tags||{},a=(t.access||'').toLowerCase(),f=(t.fee||'').toLowerCase();let free=!['customers','no'].includes(a);if(f==='yes'||f==='true')free=false;if(f==='no'||f==='false')free=true;return{id:e.type+'-'+e.id,lat:p.lat,lon:p.lon,name:t.name||t['name:cs']||t['name:en']||'Veřejné WC',free,open:true,accessible:['yes','designated','permissive'].includes((t.wheelchair||'').toLowerCase()),change:['yes','designated'].includes((t.changing_table||'').toLowerCase()),hours:t.opening_hours||'Neuvedeno'}}
function bbox(){const b=map.getBounds();return[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(',')}
async function requestOverpass(q){
  let last;
  for(const url of OVERPASS){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),12000);
    try{
      const r=await fetch(url+'?data='+encodeURIComponent(q),{
        method:'GET',
        headers:{Accept:'application/json'},
        signal:controller.signal,
        cache:'no-store'
      });
      if(!r.ok)throw Error('HTTP '+r.status);
      return await r.json();
    }catch(e){
      last=e&&e.name==='AbortError'?Error('timeout'):e;
    }finally{clearTimeout(timer)}
  }
  throw last||Error('Overpass nedostupný');
}
async function loadWC(force=false){if(loading)return;if(map.getZoom()<11){document.getElementById('status').textContent='Přibliž mapu na oblast, kde chceš WC hledat.';return}const box=bbox();if(!force&&box===lastBox)return;loading=true;document.getElementById('status').textContent='🔎 Hledám veřejná WC…';const q=`[out:json][timeout:40];(nwr["amenity"="toilets"](${box});nwr["building"="toilets"](${box}););out center tags;`;try{const data=await requestOverpass(q);toilets=(data.elements||[]).map(normalize).filter(Boolean);lastBox=box;render();document.getElementById('status').textContent=`🌍 Nalezeno ${toilets.length} WC v zobrazené oblasti · OpenStreetMap`}catch(e){console.error(e);document.getElementById('status').innerHTML='⚠️ WC se nepodařilo načíst.<br><button onclick="lastBox=\'\';loadWC(true)" style="margin-top:8px;padding:8px 14px;border:0;border-radius:10px;background:#0a84ff;color:white">🔄 Zkusit znovu</button><br><small>Technická chyba: '+(e&&e.message?e.message:'neznámá chyba')+'</small>'}finally{loading=false}}
function render(){markers.forEach(m=>m.remove());markers=[];const q=document.getElementById('search').value.toLowerCase().trim(),arr=toilets.filter(t=>(!q||t.name.toLowerCase().includes(q))&&(filter==='all'||filter==='free'&&t.free||filter==='open'&&t.open||filter==='accessible'&&t.accessible));arr.forEach(t=>markers.push(L.marker([t.lat,t.lon]).addTo(map).bindPopup(`<b>${esc(t.name)}</b><br>${t.free?'✓ Zdarma':'💳 Placené'} · 🕐 ${esc(t.hours)}${t.accessible?'<br>♿ Bezbariérové':''}`)));document.getElementById('list').innerHTML=arr.length?arr.map(t=>`<article class="wc" onclick="focusWC(${t.lat},${t.lon})"><b>${esc(t.name)}</b><div class="meta">🕐 ${esc(t.hours)}</div><div class="badges"><span class="badge">${t.free?'✓ Zdarma':'💳 Placené'}</span>${t.accessible?'<span class="badge">♿ Bezbariérové</span>':''}${t.change?'<span class="badge">👶 Přebalovací pult</span>':''}</div></article>`).join(''):'<div class="empty">V této oblasti nejsou podle aktuálních OSM dat nalezena WC.</div>'}
function focusWC(lat,lon){map.setView([lat,lon],17);const m=markers.find(x=>Math.abs(x.getLatLng().lat-lat)<1e-8&&Math.abs(x.getLatLng().lng-lon)<1e-8);if(m)m.openPopup()}
function nearestFrom(lat,lon){if(!toilets.length){map.setView([lat,lon],15);lastBox='';loadWC(true).then(()=>setTimeout(()=>nearestFrom(lat,lon),800));return}const t=toilets.slice().sort((a,b)=>dist(lat,lon,a.lat,a.lon)-dist(lat,lon,b.lat,b.lon))[0],meters=Math.round(dist(lat,lon,t.lat,t.lon)*1000);focusWC(t.lat,t.lon);if(confirm(`Nejbližší WC: ${t.name}\nVzdálenost přibližně ${meters} m.\n\nOtevřít navigaci?`))window.open(`https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lon}`,'_blank')}
async function searchPlace(){
  const q=document.getElementById('search').value.trim();
  if(!q){loadWC(true);return}
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q)}`,{
      headers:{Accept:'application/json'},cache:'no-store'
    });
    const a=await r.json();
    if(!a.length){
      document.getElementById('status').textContent='Místo nebylo nalezeno.';
      return;
    }
    map.setView([+a[0].lat,+a[0].lon],14);
    lastBox='';
    // The search field is for finding a place, not filtering WC names.
    document.getElementById('search').value='';
    render();
    loadWC(true);
  }catch(e){
    document.getElementById('status').textContent='Vyhledávání se nepodařilo: '+(e&&e.message?e.message:'chyba');
  }
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});document.getElementById('search').addEventListener('input',render);
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('Tento prohlížeč nepodporuje GPS.');navigator.geolocation.getCurrentPosition(p=>{const{latitude,longitude}=p.coords;map.setView([latitude,longitude],15);if(userMarker)userMarker.remove();userMarker=L.marker([latitude,longitude]).addTo(map).bindPopup('Tvoje poloha').openPopup();lastBox='';loadWC(true)},()=>alert('Poloha není dostupná. Povol v telefonu přístup k poloze.'))};
document.getElementById('nearest').onclick=()=>{if(!navigator.geolocation)return alert('Tento prohlížeč nepodporuje GPS.');navigator.geolocation.getCurrentPosition(p=>nearestFrom(p.coords.latitude,p.coords.longitude),()=>alert('Poloha není dostupná. Povol v telefonu přístup k poloze.'))};
map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(()=>loadWC(false),600)});loadWC(true);
</script></body></html>
